- id: nest_publish_states
  alias: "Nest → MQTT: publish ambient/setpoint/mode/humidity"
  description: "Publish Nest climate state to MQTT topics consumed by the ESP32 controller. Temperatures published in Fahrenheit."
  mode: restart
  variables:
    climate_entity: climate.living_room
  trigger:
    # Trigger on attribute changes (setpoint changes from Nest app or polling)
    - platform: state
      entity_id: climate.living_room
      attribute: temperature
    - platform: state
      entity_id: climate.living_room
      attribute: target_temp_high
    - platform: state
      entity_id: climate.living_room
      attribute: target_temp_low
    # Trigger on service calls to climate.set_temperature (HA UI changes)
    - platform: event
      event_type: call_service
      event_data:
        domain: climate
        service: set_temperature
  condition:
    # Only process service calls for climate.living_room (filter out other climate entities)
    - condition: or
      conditions:
        # Always allow non-service-call triggers (state/attribute/time)
        - condition: template
          value_template: "{{ trigger.platform != 'event' }}"
        # For service call triggers, check if target is climate.living_room
        - condition: and
          conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'event' }}"
            - condition: template
              value_template: >-
                {{ 'climate.living_room' in (trigger.event.data.service_data.entity_id | default([]) | list) or
                   trigger.event.data.service_data.entity_id | default('') == 'climate.living_room' }}
  action:
    - choose:
        - conditions: []
          sequence:
            # Publish ambient (current) temperature - Convert F to C
            - service: mqtt.publish
              data:
                topic: nest/ambient/state
                payload: >-
                  {% set temp_f = state_attr(climate_entity, 'current_temperature') | float(75.0) %}
                  {{ ((temp_f - 32) * 5 / 9) | round(0) }}
                retain: true
            # Publish humidity percent (0-100) from climate entity attribute
            - service: mqtt.publish
              data:
                topic: nest/humidity/state
                payload: >-
                  {{ state_attr(climate_entity, 'current_humidity') | float(0) }}
                retain: true
            # Publish current setpoint - Convert F to C
            - service: mqtt.publish
              data:
                topic: nest/setpoint_cool/state
                payload: >-
                  {% if trigger.platform == 'event' and trigger.event.event_type == 'call_service' %}
                    {# Service call trigger - read NEW value from service call data #}
                    {% set service_data = trigger.event.data.service_data %}
                    {% set temp_f = (service_data.get('temperature') or service_data.get('target_temp_high') or 75.0) | float %}
                    {{ ((temp_f - 32) * 5 / 9) | round(0) }}
                  {% else %}
                    {# Attribute/state trigger - read from entity attributes #}
                    {% set mode = state_attr(climate_entity, 'hvac_mode') | lower | default('off') %}
                    {% set temp_f =
                      (state_attr(climate_entity, 'temperature') if mode == 'cool' else
                       state_attr(climate_entity, 'target_temp_high') if mode == 'heat_cool' else
                       state_attr(climate_entity, 'temperature')) | float(75.0) %}
                    {{ ((temp_f - 32) * 5 / 9) | round(0) }}
                  {% endif %}
                retain: true
            # Publish hvac mode (string)
            - service: mqtt.publish
              data:
                topic: nest/mode/state
                payload: "{{ states(climate_entity) }}"
                retain: true
- id: nest_poll_for_updates
  alias: "Nest: poll for external changes"
  description: "Reload Nest integration to force fresh API data (every 2 minutes)"
  mode: single
  variables:
    climate_entity: climate.living_room
  trigger:
    - platform: time_pattern
      minutes: "/2"
  action:
    # Reload the Nest config entry to force reconnection and fresh API fetch
    # This is the ONLY way to get fresh data when push notifications aren't working
    - service: homeassistant.reload_config_entry
      target:
        entity_id: climate.living_room
    # Wait for reload to complete
    - delay:
        seconds: 3
    # Always publish current state to MQTT after reload
    - service: mqtt.publish
      data:
        topic: nest/ambient/state
        payload: >-
          {% set temp_f = state_attr(climate_entity, 'current_temperature') | float(75.0) %}
          {{ ((temp_f - 32) * 5 / 9) | round(0) }}
        retain: true
    - service: mqtt.publish
      data:
        topic: nest/humidity/state
        payload: >-
          {{ state_attr(climate_entity, 'current_humidity') | float(0) }}
        retain: true
    - service: mqtt.publish
      data:
        topic: nest/setpoint_cool/state
        payload: >-
          {% set mode = state_attr(climate_entity, 'hvac_mode') | lower | default('off') %}
          {% set temp_f =
            (state_attr(climate_entity, 'temperature') if mode == 'cool' else
             state_attr(climate_entity, 'target_temp_high') if mode == 'heat_cool' else
             state_attr(climate_entity, 'temperature')) | float(75.0) %}
          {{ ((temp_f - 32) * 5 / 9) | round(0) }}
        retain: true
    - service: mqtt.publish
      data:
        topic: nest/mode/state
        payload: "{{ states(climate_entity) }}"
        retain: true
    # Log polling activity for debugging
    - service: system_log.write
      data:
        message: "Reloaded Nest integration: temp_f={{ state_attr('climate.living_room', 'temperature') }}°F, ambient_f={{ state_attr('climate.living_room', 'current_temperature') }}°F"
        level: info

- id: nest_consume_setpoint_cmd
  alias: "MQTT → Nest: apply setpoint from controller"
  description: "Apply setpoint commands from ESP32 controller to the Nest climate entity in HA. Convert C to F."
  mode: parallel
  max: 10
  variables:
    climate_entity: climate.living_room
    temp_c: "{{ trigger.payload | float }}"
    temp_f: "{{ (temp_c * 9 / 5) + 32 }}"
  trigger:
    - platform: mqtt
      topic: nest/setpoint_cool/cmd
  condition: []
  action:
    - choose:
        # COOL mode: set the single setpoint (cool) using temperature
        - conditions: "{{ (state_attr(climate_entity, 'hvac_mode') | lower | default('')) == 'cool' or (states(climate_entity) | lower) == 'cool' }}"
          sequence:
            - service: climate.set_temperature
              target:
                entity_id: "{{ climate_entity }}"
              data:
                temperature: "{{ temp_f }}"
        # HEATCOOL mode: adjust the high (cool) setpoint only
        - conditions: "{{ (state_attr(climate_entity, 'hvac_mode') | lower | default('')) == 'heat_cool' or (states(climate_entity) | lower) == 'heat_cool' }}"
          sequence:
            - service: climate.set_temperature
              target:
                entity_id: "{{ climate_entity }}"
              data:
                target_temp_high: "{{ temp_f }}"
      default: []
- id: nest_respond_to_request
  alias: "MQTT → Nest: respond to state request"
  description: "When ESP32 requests thermostat state via nest/request_state, publish all current values. Convert F to C."
  mode: queued
  max: 5
  variables:
    climate_entity: climate.living_room
  trigger:
    - platform: mqtt
      topic: nest/request_state
  action:
    - service: mqtt.publish
      data:
        topic: nest/ambient/state
        payload: >-
          {% set temp_f = state_attr(climate_entity, 'current_temperature') | float(75.0) %}
          {{ ((temp_f - 32) * 5 / 9) | round(0) }}
        retain: true
    - service: mqtt.publish
      data:
        topic: nest/humidity/state
        payload: >-
          {{ state_attr(climate_entity, 'current_humidity') | float(0) }}
        retain: true
    - service: mqtt.publish
      data:
        topic: nest/setpoint_cool/state
        payload: >-
          {% set mode = state_attr(climate_entity, 'hvac_mode') | lower | default('off') %}
          {% set temp_f =
            (state_attr(climate_entity, 'temperature') if mode == 'cool' else
             state_attr(climate_entity, 'target_temp_high') if mode == 'heat_cool' else
             state_attr(climate_entity, 'temperature')) | float(75.0) %}
          {{ ((temp_f - 32) * 5 / 9) | round(0) }}
        retain: true
    - service: mqtt.publish
      data:
        topic: nest/mode/state
        payload: "{{ states(climate_entity) }}"
        retain: true

