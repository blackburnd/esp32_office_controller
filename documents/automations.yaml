- id: nest_publish_setpoint_cmd_on_change
  alias: "Nest changed → MQTT: emit setpoint cmd (°F)"
  description: "When climate.living_room is changed by a user in HA, publish setpoint (°F) to MQTT cmd topic."
  mode: restart
  initial_state: false  # DISABLED - was interfering with Nest control
  variables:
    climate_entity: climate.living_room
  trigger:
    - platform: state
      entity_id: climate.living_room
      attribute: temperature
    - platform: state
      entity_id: climate.living_room
      attribute: target_temp_high
  condition:
    # Only fire for user-initiated changes (prevents feedback loop from automations)
    - condition: template
      value_template: "{{ trigger.to_state.context.user_id is not none }}"
  action:
    - service: mqtt.publish
      data:
        topic: nest/setpoint_cool/cmd
        payload: >-
          {% set mode = (state_attr(climate_entity, 'hvac_mode') | lower | default('off')) %}
          {% set raw =
            (state_attr(climate_entity, 'temperature') if mode == 'cool' else
             state_attr(climate_entity, 'target_temp_high') if mode == 'heat_cool' else
             state_attr(climate_entity, 'temperature')) | float(0) %}
          {{ raw | round(0) }}
        retain: false
        qos: 1

