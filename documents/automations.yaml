# Listen for Nest device events directly from the Google Nest integration
# This captures cloud push notifications when changes are made via Nest app
- id: nest_device_event_listener
  alias: "Nest: device event listener"
  description: "Capture Nest device events from Google Cloud and immediately publish to MQTT"
  initial_state: true  # ENABLED - fixed conversion logic to match nest_publish_states
  mode: queued
  max: 10
  variables:
    climate_entity: climate.living_room
  trigger:
    # Catch all Nest-related events
    - platform: event
      event_type: nest_event
    # Also listen for device registry updates
    - platform: event
      event_type: device_registry_updated
  condition:
    # Only process events related to our Nest device
    - condition: template
      value_template: >-
        {{ 'climate.living_room' in trigger.event.data.get('entity_id', '') or
           'living_room' in (trigger.event.data.get('device_id', '') | lower) }}
  action:
    # Force immediate state refresh
    - service: homeassistant.update_entity
      target:
        entity_id: climate.living_room
    - delay:
        milliseconds: 200
    # Publish all values to MQTT - HA stores in Fahrenheit, convert F to C for ESP32
    - service: mqtt.publish
      data:
        topic: nest/ambient/state
        payload: >-
          {% set temp_f = state_attr(climate_entity, 'current_temperature') | float(75.0) %}
          {{ ((temp_f - 32) * 5 / 9) | round(0) }}
        retain: true
    - service: mqtt.publish
      data:
        topic: nest/humidity/state
        payload: >-
          {{ state_attr(climate_entity, 'current_humidity') | float(0) }}
        retain: true
    - service: mqtt.publish
      data:
        topic: nest/setpoint_cool/state
        payload: >-
          {% set mode = state_attr(climate_entity, 'hvac_mode') | lower | default('off') %}
          {% set temp_f =
            (state_attr(climate_entity, 'temperature') if mode == 'cool' else
             state_attr(climate_entity, 'target_temp_high') if mode == 'heat_cool' else
             state_attr(climate_entity, 'temperature')) | float(75.0) %}
          {{ ((temp_f - 32) * 5 / 9) | round(0) }}
        retain: true
    - service: mqtt.publish
      data:
        topic: nest/mode/state
        payload: "{{ states(climate_entity) }}"
        retain: true
    # Publish diagnostic event for debugging
    - service: mqtt.publish
      data:
        topic: nest/debug/event
        payload: >-
          {{ now().isoformat() }}: {{ trigger.event.event_type }} - {{ trigger.event.data }}
        retain: false
