- id: camera_motion_west_canal
  alias: "Camera Motion: West Canal → MQTT"
  description: "Publish West Canal (channel 5) motion to MQTT for ESP32 panel"
  mode: restart
  trigger:
    - platform: state
      entity_id: binary_sensor.east_motion
      to: 'on'
  action:
    - service: mqtt.publish
      data:
        topic: "esp32_office_controller/camera/5/motion"
        payload: "ON"
        retain: false
        qos: 1

