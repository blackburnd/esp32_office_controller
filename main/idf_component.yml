dependencies:
  idf:
    version: '>=5.1.0'

  lvgl/lvgl:
    version: '>8.3.9,<9'
    public: true

  esp_lcd_touch_gt911: ^1
  espressif/esp_jpeg: ^1.3.1
  espressif/esp_lvgl_port: ^2.6.0
  espressif/esp_mmap_assets: ^1.3.1~2
  espressif/esp32_io_expander: ^1.1.0
  # Pin cmake utilities to a revision compatible with ESP-IDF 5.4.x.
  # Newer 0.5.x releases package as a non-component tool which IDF 5.4.1
  # attempts to treat as a component, causing: "does not contain a component".
  espressif/cmake_utilities:
    version: '<0.5.0'
